name: Test and build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases on tags

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m unittest -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: VidGrab-windows }
          - { os: macos-latest, name: VidGrab-macos }
          - { os: ubuntu-latest, name: VidGrab-linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller vidgrab.spec --noconfirm
      - name: Package
        shell: bash
        run: |
          cd dist
          if [ -d VidGrab.app ]; then
            ditto -c -k --keepParent VidGrab.app ../${{ matrix.name }}.zip
          elif [ -f VidGrab.exe ]; then
            7z a ../${{ matrix.name }}.zip VidGrab.exe
          else
            zip ../${{ matrix.name }}.zip VidGrab
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd extension && zip -r ../VidGrab-browser-extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: VidGrab-browser-extension
          path: VidGrab-browser-extension.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
